name: run-bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5  # Обновлено с v4
      
      - name: Set up Python
        uses: actions/setup-python@v6  # Обновлено с v5
        with:
          python-version: '3.10' # или ваша версия
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # или ваша команда
      
      - name: Run bot
        env:
          TELEGRAM_DWOBOTAI_TOKEN: ${{ secrets.TELEGRAM_DWOBOTAI_TOKEN }}
        run: python bot_dwoai_github.py
